# Loci default configuration. Paths are relative to the repo root.

paths:
  data: data
  sessions: data/sessions
  memory_db: data/memory.sqlite
  cache: .cache/loci
  checkpoints: checkpoints

cloud:
  enabled: false   # Phase 1: no Meta Model API calls at all

models:
  sam3:
    checkpoint: checkpoints/sam3.1/sam3.1_multiplex.pt
  mapanything:
    checkpoint: checkpoints/map-anything-apache
  glimmer:
    quant: UD-Q3_K_XL
    model: checkpoints/glimmer/Muse-Glimmer-30B-UD-Q3_K_XL.gguf
    mmproj: checkpoints/glimmer/mmproj-Muse-Glimmer-30B-Q8_0.gguf  # BF16 (3.7 GB) does not fit next to Q3
    server_bin: ../llama.cpp/build/bin/llama-server
    port: 8001
    # OpenAI-compatible endpoint. Local llama-server by default; point at a hosted Glimmer to switch.
    base_url: http://127.0.0.1:8001/v1
    ctx: 16384
    n_gpu_layers: 99
  whisper:
    size: small

providers:
  namer: glimmer
  vision_checker: glimmer
  transcriber: faster_whisper

extract:
  max_keyframes: 80
  candidate_fps: 8  # more candidates so fast pans can get more keyframes
  min_sharpness_quantile: 0.3

scenes:
  home:
    # prompt: confidence threshold. Low thresholds favour recall: a missed face is worse than extra blur.
    redact_prompts: {face: 0.3, computer screen: 0.4, phone screen: 0.4, document with text: 0.5}
    vocab: [gas stove, burner flame, pan, desk, computer monitor, keyboard, potted plant,
            keys, wallet, charger, door, window, light, laundry pile, laundry bucket, washing machine]
  street:
    redact_prompts: {face: 0.3, license plate: 0.3}
    vocab: [shop sign, signboard, shop front, fruit stall, vegetable stall, coconut stall, bus stop, ATM, tree]
    exclude_from_pointcloud: [person, car, motorcycle, auto rickshaw, bus]

track:
  min_score: 0.5
