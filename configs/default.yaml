# Loci default configuration. Paths are relative to the repo root.

paths:
  data: data
  sessions: data/sessions
  memory_db: data/memory.sqlite
  cache: .cache/loci
  checkpoints: checkpoints

cloud:
  # Muse Spark answers, Muse Voice transcribes home audio; Glimmer does the rest. LOCI_CLOUD=0 = fully on device.
  enabled: true

models:
  sam3:
    checkpoint: checkpoints/sam3.1/sam3.1_multiplex.pt
  mapanything:
    checkpoint: checkpoints/map-anything-apache
  glimmer:
    quant: UD-Q3_K_XL
    model: checkpoints/glimmer/Muse-Glimmer-30B-UD-Q3_K_XL.gguf
    mmproj: checkpoints/glimmer/mmproj-Muse-Glimmer-30B-Q8_0.gguf  # BF16 (3.7 GB) does not fit next to Q3
    server_bin: ../llama.cpp/build/bin/llama-server
    port: 8001
    # OpenAI-compatible endpoint. Local llama-server by default; point at a hosted Glimmer to switch.
    base_url: http://127.0.0.1:8001/v1
    ctx: 16384
    n_gpu_layers: 99
  whisper:
    size: small
  muse_voice:  # Meta Model API; used when providers.transcriber is muse_voice (home audio only)
    language_bias: [English, Tamil]  # the speaker's languages; Kannada here wrote Tamil speech in Kannada script

providers:
  namer: glimmer
  vision_checker: glimmer
  transcriber: muse_voice  # Meta Muse Voice Transcribe when cloud is on; faster-whisper otherwise and for street audio

extract:
  max_keyframes: 0  # 0 = follow the walk's length: ~1 per second, 60..360 (geometry runs in chunks)
  candidate_fps: 8  # more candidates so fast pans can get more keyframes
  min_sharpness_quantile: 0.3

scenes:
  home:
    # prompt: confidence threshold. Low thresholds favour recall: a missed face is worse than extra blur.
    redact_prompts: {face: 0.3, computer screen: 0.4, phone screen: 0.4, document with text: 0.5}
    vocab: [gas stove, burner flame, pan, desk, computer monitor, keyboard, potted plant,
            keys, wallet, charger, door, window, light, ceiling light, tube light, lamp, laptop stand,
            laundry pile, laundry bucket, washing machine]
  street:
    redact_prompts: {face: 0.3, license plate: 0.3}
    vocab: [shop sign, signboard, shop front, fruit stall, vegetable stall, coconut stall, bus stop, ATM, tree]
    exclude_from_pointcloud: [person, car, motorcycle, auto rickshaw, bus]
    # not stored as memories: what passers-by carry or ride belongs to them, and it does not stay put
    exclude_from_memory: [person, car, motorcycle, scooter, suv, sedan, auto rickshaw, bus, helmet, backpack, bag,
                          mobile phone, phone, water bottle, umbrella]

name:
  # area label every n-th keyframe; a quick walk crosses a room in a few frames (5 lost the desk's room on home2)
  area_every: 2

track:
  min_score: 0.5

attributes:
  # per scene: observations asked per object, labels not checked, and a time budget (s) for careful second
  # looks (null = escalate each unsure answer right away). A 6-min walk has ~800 signs; the careful look is ~10x
  # slower than the quick one, so long walks get a quick pass over everything, then second looks by priority.
  home:
    per_object: 2
    skip: []
    second_budget_s: null
    describe: all  # colour and everyday name, so "the purple bucket" is found without looking again
    describe_skip: [door, window, socket, outlet, switch]
  street:
    per_object: 1
    skip: [street lamp]
    second_budget_s: 1800
    describe: [stall, stand, cart, shop front, kiosk]  # what they sell: "the coconut stall"
    describe_skip: []

associate:
  # a fast indoor walk moves things up to a metre between neighbouring keyframes
  home: {adjacent_gap_s: 0.8, adjacent_dist_m: 1.2}

demo:
  # serve verified answers from data/answer_cache.json (fill it with `loci warm eval/questions.yaml`)
  cache_answers: true

geometry:
  # MapAnything views per chunk (~13 GB at 80, ~12 GB at 60, ~11 GB at 20) and frames shared between chunks
  chunk_views: 60
  chunk_overlap: 10
