# Eval questions for the developer's own captures (data/raw/home.mp4, data/raw/street.mp4).
# expect: labels the answered object should match (fuzzy). refuse: the right answer is "not seen".
# state: keys the stored state must have. Questions without expect/state are checked by hand.

- clip: home.mp4
  scene: home
  questions:
    - q: "What's on my desk?"
      expect: [computer monitor, laptop, keyboard, desk]
    - q: "Where is my laptop?"
      expect: [laptop]
    - q: "Where's the keyboard?"
      expect: [keyboard]
    - q: "Is the laundry done?"
      expect: [laundry pile, laundry bucket, clothes]
    - q: "Where's the purple bucket?"
      expect: [bucket, laundry bucket]
    - q: "Where did I leave my backpack?"
      expect: [backpack, bag]
    - q: "Where's the laptop stand?"
      expect: [laptop stand, stand]
    - q: "Is the stove on?"
      note: no lit stove in this capture; a correct answer says no state is recorded or names the stove with as-of time
    - q: "Are the lights on?"  # no ceiling or lamp is in these walks: saying none was seen is the right answer
      refuse: true
    - q: "How far is the desk from the door?"
      note: metres, sanity range 1-5 m
    - q: "Where's my passport?"
      refuse: true
    - q: "Where are my car keys?"
      refuse: true
    - q: "ಸ್ಟವ್ ಆನ್ ಆಗಿತ್ತಾ?"  # Kannada: was the stove on?
      expect: [gas stove]
    - q: "அடுப்பு எரிந்துகொண்டிருந்ததா?"  # Tamil: was the stove burning?
      expect: [gas stove]
    - q: "என் பை எங்கே?"  # Tamil: where is my bag?
      expect: [backpack, bag, plastic bag]
    - q: "What changed in my home since the first capture?"  # home -> home2 (stove went off)
      note: should mention the stove (lit in the first capture, off in the second); checked by hand

- clip: street.mp4
  scene: street
  questions:
    - q: "Where was the coconut stall?"
      expect: [coconut stall, coconut, fruit stand]  # stored as "fruit stand"; the agent confirms coconuts with look
    - q: "What shops did I pass?"
      expect: [shop sign, signboard, shop front, stall]
    - q: "Was the coconut stall open?"
      expect: [coconut stall, fruit stand]
    - q: "How do I get from the coconut stall to the next shop?"
      note: uses route; distance and direction along the walk
    - q: "Which side of the road were the shops on?"
      expect: [shop front, shop sign, stall]
    - q: "Where's the nearest ATM?"
      refuse: true
    - q: "ಶ್ರೀ ಲಕ್ಷ್ಮಿ ಅಂಗಡಿ ಎಲ್ಲಿತ್ತು?"  # Kannada: where was the Sri Lakshmi shop?
      expect: [signboard, shop sign]
    - q: "தேங்காய் கடை எங்கே இருந்தது?"  # Tamil: where was the coconut shop?
      expect: [fruit stand, coconut stall, street stall]

- clip: street2.mp4   # 6-minute walk from the office (Novel MSR Park), 1080p, no audio
  scene: street
  questions:
    - q: "Where was Kalyan Jewellers?"
      expect_text: kalyan
      expect: [signboard, shop sign, shop front]
    - q: "Where was the Levi's store?"
      expect_text: levi
      expect: [signboard, shop sign, shop front]
    - q: "Which side of the road was BIBA on?"
      expect_text: biba
      expect: [signboard, shop sign, shop front]
    - q: "How far from my office was Louis Philippe?"
      expect_text: louis
      expect: [signboard, shop sign, shop front]
    - q: "How do I get from Kalyan Jewellers to Levi's?"
      note: uses route; distance, direction and shops passed in between
    - q: "Did I pass a fruit cart?"
      expect: [fruit cart, fruit stall, fruit stand, cart, street stall, banana]
    - q: "What clothing stores did I pass?"
      expect: [signboard, shop sign, shop front]
    - q: "Was there a Lenovo shop?"
      expect_text: lenovo
      expect: [signboard, shop sign, shop front]
    - q: "Where's the nearest metro station?"
      refuse: true
    - q: "ಕಲ್ಯಾಣ್ ಜ್ಯುವೆಲ್ಲರ್ಸ್ ಎಲ್ಲಿತ್ತು?"  # Kannada: where was Kalyan Jewellers?
      expect_text: kalyan
      expect: [signboard, shop sign, shop front]
    - q: "லீவைஸ் கடை எங்கே இருந்தது?"  # Tamil: where was the Levi's shop?
      expect_text: levi
      expect: [signboard, shop sign, shop front]
