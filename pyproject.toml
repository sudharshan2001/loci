[project]
name = "loci"
version = "0.1.0"
description = "A private 3D memory of the places you move through, for AI glasses and robots."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "numpy>=2",
    "opencv-python-headless==4.10.0.84",
    "pillow",
    "pyyaml",
    "typer",
    "requests",
    "openai",
    "faster-whisper",
    "rapidfuzz",
    "plyfile",
    "scipy",
    "sam3",
    "mapanything",
]

[project.scripts]
loci = "loci.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
# sam3 pins numpy<2 conservatively; mapanything (rerun-sdk) needs numpy>=2. Verified by smoke test.
override-dependencies = ["numpy>=2"]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
sam3 = { path = "third_party/sam3", editable = true }
mapanything = { path = "third_party/map-anything", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loci"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
